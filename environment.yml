# AccessWalk dev environment (micromamba / conda-forge)
# Create:  micromamba create -y -f environment.yml
# Update:  micromamba update -y -n accesswalk -f environment.yml
name: accesswalk
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - ffmpeg          # frame sampling, fps re-encode, WAV extraction for Voice Transcribe
  - nodejs=20       # React/Vite frontend; also lets us run @meta-sam/parser if needed
  - pip:
      # Model clients (Meta Model API + Baseten are both OpenAI-compatible)
      - openai>=1.40
      - httpx>=0.27
      - requests>=2.31
      - websockets>=12
      # Backend
      - fastapi>=0.110
      - uvicorn[standard]>=0.29
      - python-multipart>=0.0.9
      - pydantic>=2.6
      - python-dotenv>=1.0
      - pyyaml>=6.0
      # Video / masks / eval
      - numpy>=1.26
      - opencv-python-headless>=4.9
      - pillow>=10.2
      - pandas>=2.2
      # Dev
      - pytest>=8.0
      - ruff>=0.4
